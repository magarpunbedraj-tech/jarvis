<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis Multi-Agent</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--line:#263451;--text:#eaf0ff;--muted:#93a4c7;--blue:#6ea8fe;--green:#65d6a6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172445,#080c17 60%);font:15px system-ui;color:var(--text)}header{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:23px}small,.muted{color:var(--muted)}.status{color:var(--green)}main{max-width:1200px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:260px 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.agents button{display:block;width:100%;text-align:left;margin:7px 0;padding:12px;border:1px solid var(--line);background:#0d1528;color:var(--text);border-radius:10px;cursor:pointer}.agents button.active{border-color:var(--blue);background:#172746}.content{display:grid;gap:16px}.chatlog{height:330px;overflow:auto;background:#0a1020;border:1px solid var(--line);border-radius:12px;padding:12px}.msg{padding:10px 12px;margin:8px 0;border-radius:10px;background:#17223a;white-space:pre-wrap}.user{background:#1b3150}.controls{display:flex;gap:8px;margin-top:10px}input,textarea,select{background:#0a1020;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%}button.primary{background:#316bd6;border:0;color:white;padding:10px 15px;border-radius:9px;cursor:pointer}form{display:grid;gap:9px}.task{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.task strong{display:block}.pill{font-size:12px;color:var(--green)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){main{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}header{padding:16px}}
</style></head><body><header><div><h1>◈ JARVIS <span style="color:var(--blue)">MULTI-AGENT</span></h1><small>Local-first personal AI workspace</small></div><div id="health" class="status">Connecting…</div></header><main><aside class="panel agents"><h3>Specialist agents</h3><div id="agentlist"></div><p class="muted">Select a specialist for chat or task assignment. Events and handoffs are shared.</p></aside><section class="content"><div class="panel"><div style="display:flex;justify-content:space-between"><h3 style="margin:0 0 12px">Agent workspace</h3><span id="model" class="muted"></span></div><div id="chatlog" class="chatlog"><div class="muted">Send a request to Jarvis or a specialist.</div></div><div class="controls"><input id="message" placeholder="Ask an agent to work on something…"><button class="primary" onclick="send()">Send</button></div></div><div class="grid2"><div class="panel"><h3>Task queue</h3><form id="taskform"><input id="title" placeholder="Task title" required><textarea id="desc" placeholder="Task details (optional)" rows="2"></textarea><select id="taskagent"></select><button class="primary">Create task</button></form><div id="tasks"></div></div><div class="panel"><h3>Agent activity / communication</h3><div id="events" style="max-height:380px;overflow:auto"></div></div></div></section></main><script>
let selected='manager', agents={};const $=id=>document.getElementById(id);
async function api(path,opt={}){let r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw Error(await r.text());return r.json()}
function addmsg(who,text,cls=''){let d=document.createElement('div');d.className='msg '+cls;d.textContent=who+': '+text;$('chatlog').append(d);$('chatlog').scrollTop=$('chatlog').scrollHeight}
async function init(){try{let h=await api('/api/health'),c=await api('/api/config');$('health').textContent='● API online';$('model').textContent=c.provider+' · '+c.model;let ps=await api('/api/providers');$('model').textContent+=(ps.configured.length?' · '+ps.configured.length+' cloud API(s)':' · add free API key in .env');agents=await api('/api/agents');$('agentlist').innerHTML='';$('taskagent').innerHTML='';for(let [id,a] of Object.entries(agents)){let b=document.createElement('button');b.textContent=a.name;b.className=id===selected?'active':'';b.onclick=()=>{selected=id;document.querySelectorAll('.agents button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};$('agentlist').append(b);$('taskagent').add(new Option(a.name,id))}await refresh()}catch(e){$('health').textContent='● API not running';$('health').style.color='#ff8d8d'}}
async function send(){let m=$('message').value.trim();if(!m)return;$('message').value='';addmsg('You',m,'user');addmsg(agents[selected]?.name||selected,'Working…');try{let r=await api('/api/chat',{method:'POST',body:JSON.stringify({message:m,agent:selected})});$('chatlog').lastChild.textContent=(agents[selected]?.name||selected)+': '+r.answer}catch(e){$('chatlog').lastChild.textContent='Error: '+e}}
$('message').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
$('taskform').onsubmit=async e=>{e.preventDefault();await api('/api/tasks',{method:'POST',body:JSON.stringify({title:$('title').value,description:$('desc').value,agent:$('taskagent').value})});$('title').value='';$('desc').value='';refresh()};
async function run(id){let b=event.target;try{await api('/api/tasks/'+id+'/run',{method:'POST'});refresh()}catch(e){alert(e)}}
async function refresh(){let ts=await api('/api/tasks');$('tasks').innerHTML=ts.map(t=>'<div class="task"><strong>'+esc(t.title)+'</strong><small>'+t.agent+' · '+t.status+'</small><p>'+esc(t.result||t.description||'')+'</p>'+(t.status!=='done'?'<button class="primary" onclick="runTask(\''+t.id+'\')">Run task</button>':'')+'</div>').join('')||'<p class="muted">No tasks yet.</p>';let ev=await api('/api/events');$('events').innerHTML=ev.reverse().map(e=>'<div class="task"><small>'+new Date(e.time*1000).toLocaleTimeString()+' · '+e.kind+'</small><div>'+esc(e.agent||e.from_agent||e.task_id||'system')+'</div><small>'+esc((e.result||e.content||e.prompt||'').slice(0,180))+'</small></div>').join('')||'<small>No activity yet.</small>'}
async function runTask(id){try{await api('/api/tasks/'+id+'/run',{method:'POST'});refresh()}catch(e){alert(e)}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
init();setInterval(refresh,7000);
</script></body></html>
